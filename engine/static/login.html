<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · KestrelPro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b4532a'/%3E%3Cpath fill='%23fff' d='M16 57C13 44 14.5 30 23 21.5 29 15.5 37 13.5 43.5 14.5 48.5 15.3 51.8 18.4 53.6 22.4 57.4 22.9 60.6 25.6 61 29.6 61.2 32 60.1 34.4 58.3 35.2 58.6 33 57.6 31.4 55.8 31.2L52.6 31.6C51.4 37.4 46.8 43.4 40.6 47.2L42 57z'/%3E%3Cg fill='%23b4532a'%3E%3Ccircle cx='45.6' cy='23.2' r='2.6'/%3E%3Cpath d='M44.4 28c.4 4.2-.6 8.4-3 11.8-.6.8-1.8.7-2.1-.3-1-3.6.4-7.9 3.4-11.6z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* Same tokens as index.html */
  :root {
    color-scheme: light;
    --bg: #f4f3f0; --surface-1: #fcfcfb; --line: #e6e4df;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
    --brand: #b4532a; --brand-2: #d9793f; --ink-btn: #1d1d1b; --ink-btn-text: #fcfcfb;
    --st-bad: #c2333b; --st-bad-bg: #fbeceb; --st-good: #1b7a45; --st-good-bg: #e7f5ec; --focus: #2a78d6;
    --shadow: 0 1px 2px rgba(20, 20, 15, .04), 0 12px 32px rgba(20, 20, 15, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #121211; --surface-1: #1a1a19; --line: #2b2b29;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
      --brand: #d0693a; --brand-2: #e48a52; --ink-btn: #f0efec; --ink-btn-text: #121211;
      --st-bad: #ff8a8f; --st-bad-bg: #3a1d1f; --st-good: #6bd396; --st-good-bg: #15301f; --focus: #3987e5;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface-1: #1a1a19; --line: #2b2b29;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --brand: #d0693a; --brand-2: #e48a52; --ink-btn: #f0efec; --ink-btn-text: #121211;
    --st-bad: #ff8a8f; --st-bad-bg: #3a1d1f; --st-good: #6bd396; --st-good-bg: #15301f; --focus: #3987e5;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text-primary);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .hero { background: linear-gradient(135deg, var(--brand), var(--brand-2)); height: 220px; }
  .card { width: min(400px, calc(100% - 32px)); margin: -150px auto 40px; background: var(--surface-1);
          border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px 24px; box-shadow: var(--shadow); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .brand svg { width: 44px; height: 44px; flex: none; }
  .brand h1 { margin: 0; font-size: 21px; letter-spacing: -.01em; }
  .brand p { margin: 0; color: var(--text-muted); font-size: 13px; }
  label.h { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .pw { position: relative; }
  input[type=password], input[type=text] { width: 100%; font: inherit; color: var(--text-primary); background: var(--surface-1);
           border: 1px solid var(--line); border-radius: 10px; padding: 10px 44px 10px 12px; }
  input[type=password]:focus, input[type=text]:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
  .reveal { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none;
            color: var(--text-muted); padding: 6px; border-radius: 7px; cursor: pointer; display: grid; place-items: center; }
  .reveal:hover { color: var(--text-primary); }
  .reveal svg { width: 18px; height: 18px; }
  .help { color: var(--text-muted); font-size: 12.5px; margin-top: 6px; }
  .remember { display: flex; align-items: center; gap: 8px; margin: 16px 0 20px; font-size: 14px; color: var(--text-secondary); }
  .remember input { accent-color: var(--brand); width: 16px; height: 16px; margin: 0; }
  button.primary { width: 100%; font: inherit; font-weight: 600; background: var(--ink-btn); color: var(--ink-btn-text);
                   border: 1px solid var(--ink-btn); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  button.primary:hover { opacity: .9; }
  button.primary:disabled { opacity: .6; cursor: default; }
  .msg { border-radius: 10px; padding: 9px 12px; font-size: 14px; margin-bottom: 16px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: var(--st-bad-bg); color: var(--st-bad); }
  .msg.ok { background: var(--st-good-bg); color: var(--st-good); }
  footer { text-align: center; color: var(--text-muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="hero"></div>

<main class="card">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="15" fill="var(--brand)"/>
      <path fill="#fff" d="M16 57C13 44 14.5 30 23 21.5 29 15.5 37 13.5 43.5 14.5 48.5 15.3 51.8 18.4 53.6 22.4 57.4 22.9 60.6 25.6 61 29.6 61.2 32 60.1 34.4 58.3 35.2 58.6 33 57.6 31.4 55.8 31.2L52.6 31.6C51.4 37.4 46.8 43.4 40.6 47.2L42 57z"/>
      <g fill="var(--brand)"><circle cx="45.6" cy="23.2" r="2.6"/><path d="M44.4 28c.4 4.2-.6 8.4-3 11.8-.6.8-1.8.7-2.1-.3-1-3.6.4-7.9 3.4-11.6z"/></g>
    </svg>
    <div>
      <h1>Sign in to KestrelPro</h1>
      <p>DNS blocking with an AI second opinion</p>
    </div>
  </div>

  <div class="msg err" id="failed" role="alert">That password didn't work. Try again.</div>
  <div class="msg ok" id="signedOut" role="status">You've been signed out.</div>

  <form method="post" action="/login" id="form">
    <label class="h" for="password">Password</label>
    <div class="pw">
      <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
      <button type="button" class="reveal" id="reveal" aria-label="Show password" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="help">The admin password, unless a separate dashboard password was set.</div>
    <label class="remember"><input type="checkbox" name="remember" checked> Keep me signed in for 30 days</label>
    <button type="submit" class="primary" id="submit">Sign in</button>
  </form>
</main>
<footer>KestrelPro</footer>

<script>
  const params = new URLSearchParams(location.search);
  if (params.has("failed")) document.getElementById("failed").classList.add("show");
  if (params.has("signed_out")) document.getElementById("signedOut").classList.add("show");
  const pw = document.getElementById("password"), reveal = document.getElementById("reveal");
  reveal.addEventListener("click", () => {
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    reveal.setAttribute("aria-pressed", show);
    reveal.setAttribute("aria-label", show ? "Hide password" : "Show password");
    pw.focus();
  });
  document.getElementById("form").addEventListener("submit", () => {
    const b = document.getElementById("submit"); b.disabled = true; b.textContent = "Signing in…";
  });
</script>
</body>
</html>
