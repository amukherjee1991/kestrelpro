name: Image

# Push to main: build the image and smoke-test it (nothing is published).
# Tag v*, e.g. v2026.10.0-k1: smoke-test, then build for PC and Raspberry Pi and publish
#   ghcr.io/<owner>/kestrelpro:<version> and :latest.
# One-time setup (FORKS_TOKEN): see docs/RELEASING.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kestrelpro
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Which forks to build from
        id: forks
        env:
          FORKS_TOKEN: ${{ secrets.FORKS_TOKEN }}
        run: |
          if [ -z "$FORKS_TOKEN" ]; then
            msg="Secret FORKS_TOKEN is missing; the build needs read access to the two fork repositories. See docs/RELEASING.md."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg Skipping the image build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "web_repo=$(jq -r .web.repo forks.json)" >> "$GITHUB_OUTPUT"
          echo "web_ref=$(jq -r .web.ref forks.json)" >> "$GITHUB_OUTPUT"
          echo "docker_repo=$(jq -r .docker.repo forks.json)" >> "$GITHUB_OUTPUT"
          echo "docker_ref=$(jq -r .docker.ref forks.json)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.forks.outputs.ready == 'true'
        with:
          repository: ${{ steps.forks.outputs.web_repo }}
          ref: ${{ steps.forks.outputs.web_ref }}
          token: ${{ secrets.FORKS_TOKEN }}
          path: web
          fetch-depth: 0   # the admin UI reads its version from git

      - uses: actions/checkout@v7
        if: steps.forks.outputs.ready == 'true'
        with:
          repository: ${{ steps.forks.outputs.docker_repo }}
          ref: ${{ steps.forks.outputs.docker_ref }}
          token: ${{ secrets.FORKS_TOKEN }}
          path: docker-pi-hole

      - uses: docker/setup-qemu-action@v4
        if: steps.forks.outputs.ready == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.forks.outputs.ready == 'true'

      - name: Build for the smoke test (PC)
        if: steps.forks.outputs.ready == 'true'
        uses: docker/build-push-action@v7
        with:
          context: docker-pi-hole/src
          build-contexts: |
            kestrelpro-web=web
            kestrelpro-engine=engine
          build-args: |
            CORE_BRANCH=v6.5
            PADD_BRANCH=master
            PIHOLE_DOCKER_TAG=kestrelpro-${{ steps.forks.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: kestrelpro:ci

      - name: Smoke test
        if: steps.forks.outputs.ready == 'true'
        run: |
          command -v dig >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils)
          tools/smoke-test.sh kestrelpro:ci

      - name: Sign in to the registry
        if: steps.forks.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish for PC and Raspberry Pi
        if: steps.forks.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: docker-pi-hole/src
          build-contexts: |
            kestrelpro-web=web
            kestrelpro-engine=engine
          build-args: |
            CORE_BRANCH=v6.5
            PADD_BRANCH=master
            PIHOLE_DOCKER_TAG=kestrelpro-${{ steps.forks.outputs.version }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.forks.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=KestrelPro
            org.opencontainers.image.description=Pi-hole replacement with AI review for the domains block lists miss
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.forks.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=EUPL-1.2
